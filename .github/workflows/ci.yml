name: JRuby CI

on: [push, pull_request]

env:
  JAVA_OPTS: '-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms60M -Xmx2g -XX:InitialCodeCacheSize=40M -XX:ReservedCodeCacheSize=120M'

permissions:
  contents: read

jobs:

  maven-precache:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Precache Maven dependencies (${{ matrix.os }})

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: set up java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'maven'
      - name: fetch Maven dependencies and plugins
        # The maven/* artifact modules depend on JRuby snapshots so limit to bootstrap modules.
        # exclude system scope for jars built by JRuby modules and included in dependencies.
        run: ./mvnw -ntp -Pbootstrap -DexcludeScope=system dependency:go-offline

  rake-test:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: ['test:jruby:int', 'spec:ruby:fast', 'spec:ji', 'spec:ffi', 'test:mri:core:jit', 'test:mri:extra', 'spec:ruby:fast:jit', 'test:mri:stdlib', 'spec:ruby:slow', 'spec:ruby:debug', 'test:jruby:aot', 'test:slow_suites', 'spec:compiler', 'spec:regression', 'spec:jrubyc', 'spec:profiler', 'test:jit_compile']
        java-version: ['21', '25', '27']
      fail-fast: false

    name: rake ${{ matrix.target }} (Java ${{ matrix.java-version }})

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: ${{ matrix.java-version }}
      - name: rake ${{ matrix.target }}
        run: bin/jruby -S rake ${{ matrix.target }}

  error-prone:
    needs: maven-precache
    runs-on: ubuntu-latest

    name: error-prone (Java 21)

    env:
      ERROR_PRONE: true

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          remove-old-java: false
          bundle-install: false

  # This job is a fast-fail all-interp run of test:mri:code to give early indication if the jitted runs will pass.
  rake-test-mri-fast:
    needs: maven-precache
    name: rake test:mri:core:int (Java 27, fast fail)

    runs-on: ubuntu-latest

    env:
      JRUBY_OPTS: '--dev'

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: 27
      - name: rake test:mri:core:int
        run: bin/jruby -S rake test:mri:core:int

  rake-test-multiplatform:
    needs: maven-precache
    runs-on: ${{ matrix.platform }}

    strategy:
      matrix:
        target: ['spec:jruby']
        platform: ['ubuntu-latest', 'macos-latest']
        java-version: ['21', '25', '27']
      fail-fast: false

    name: rake ${{ matrix.target }} (Java ${{ matrix.java-version }})

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: ${{ matrix.java-version }}
          remove-old-java: false
      - name: rake ${{ matrix.target }}
        run: bin/jruby -S rake ${{ matrix.target }}

  repeat-specs:
    needs: maven-precache
    runs-on: ubuntu-latest

    name: run specs repeatedly to test optimizations

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: run specs
        env:
          JAVA_OPTS: '-XX:TieredStopAtLevel=1'
        run: bin/jruby spec/mspec/bin/mspec ci -R 4 -T-Xjit.threshold=0 :language

  jruby-tests-dev:
    needs: maven-precache
    runs-on: ubuntu-latest

    env:
      JRUBY_OPTS: '--dev'

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          distribution: 'temurin'
      - name: rake test:jruby
        run: bin/jruby --dev -S rake test:jruby

  rake-test-indy-off:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: ['test:mri:core:jit', 'test:jruby:jit', 'spec:compiler', 'spec:ruby:fast:jit', 'spec:ji']
        java-version: ['21', '25', '27']
      fail-fast: false

    name: rake ${{ matrix.target }} (Java ${{ matrix.java-version }} -indy)

    env:
      JRUBY_OPTS: '-Xcompile.invokedynamic=false -X+C -Xjit.threshold=0'

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: ${{ matrix.java-version }}
      - name: rake ${{ matrix.target }}
        run: bin/jruby -S rake ${{ matrix.target }}

  mvn-test:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-flags: ['-Pmain', '-Pdist', '-Pcomplete', '-Posgi', '-Ptest', '-Pmain,test -Dinvoker.test=extended']
        java-version: [21, 25]
      fail-fast: false

    name: mvn ${{ matrix.package-flags }} (Java ${{ matrix.java-version }})

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: ${{ matrix.java-version }}
      - name: mvn package ${{ matrix.package-flags }}
        run: tool/maven-ci-script.sh
        env:
          PHASE: 'package ${{ matrix.package-flags }}'

  mvn-test-extended:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-flags: ['-Pjruby-jars', '-Pjruby-jars,test -Dinvoker.test=extended', '-Pjruby_complete_jar_extended -Dinvoker.skip=true']
        java-version: [21, 25]
      fail-fast: false


    name: mvn ${{ matrix.package-flags }} (Java ${{ matrix.java-version }})

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      - name: mvn package ${{ matrix.package-flags }}
        run: tool/maven-ci-script.sh
        env:
          PHASE: 'package ${{ matrix.package-flags }}'

  regression-specs-jit:
    needs: maven-precache
    runs-on: ubuntu-latest

    env:
      JRUBY_OPTS: '-Xjit.threshold=0'

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: rake spec:regression
        run: bin/jruby -S rake spec:regression

  mvn-test-windows:
    needs: maven-precache
    runs-on: windows-latest

    name: mvn -Ptest, rake test:jruby (Windows, Java 21)

    env: &windows-env
      JAVA_OPTS: "-Djdk.io.File.enableADS=true"
      JDK_JAVA_OPTS: "-Djdk.io.File.enableADS=true"

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: rake test:jruby
        run: bin/jruby -S rake test:jruby TESTOPTS="--no-show-detail-immediately"
        env:
          JRUBY_OPTS: ''
      - name: mvn -P test
        run: ./mvnw -ntp package -Ptest

  spec-ruby-prism-wasm:
    needs: maven-precache
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rubyspec-target: ['language', 'core']

    name: ${{ matrix.rubyspec-target }} specs (WASM Prism parser, Java 21)

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: ${{ matrix.rubyspec-target }} specs
        run: bin/jruby spec/mspec/bin/mspec ci :${{ matrix.rubyspec-target }}
        env:
          JRUBY_OPTS: -Xparser.prism -Xparser.prism.wasm

  spec-ruby-language-windows:
    needs: maven-precache
    runs-on: windows-latest

    name: language specs (Windows, Java 21)

    env: *windows-env

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: language specs interpreted
        run: bin/jruby spec/mspec/bin/mspec ci :language
      - name: language specs compiled
        run: bin/jruby spec/mspec/bin/mspec ci :language
        env:
          JRUBY_OPTS: -Xjit.threshold=0

  spec-ruby-core-windows:
    needs: maven-precache
    runs-on: windows-latest

    name: core specs (Windows, Java 21)

    env: *windows-env

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
      - name: core specs interpreted
        run: bin/jruby spec/mspec/bin/mspec ci :core
      - name: core specs compiled
        run: bin/jruby spec/mspec/bin/mspec ci :core
        env:
          JRUBY_OPTS: -Xjit.threshold=0

  spec-ruby-freebsd:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rubyspec-target: ['language', 'core']

    name: ${{ matrix.rubyspec-target }} specs (FreeBSD, Java 21)

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: pre-build JRuby
        uses: ./.github/actions/bootstrap
        with:
          remove-old-java: false
      - name: run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y openjdk21
          run: |
            export JAVA_HOME="/usr/local/openjdk21"
            export TZ="America/Chicago"
            bin/jruby spec/mspec/bin/mspec ci :${{ matrix.rubyspec-target }}

  spec-ruby-openbsd:
    needs: maven-precache
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rubyspec-target: ['language', 'core']

    name: ${{ matrix.rubyspec-target }} specs (OpenBSD, Java 21)

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: pre-build JRuby
        uses: ./.github/actions/bootstrap
        with:
          remove-old-java: false
      - name: run in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add jdk--%21
          run: |
            export JAVA_HOME="/usr/local/jdk-21"
            export TZ="America/Chicago"
            bin/jruby spec/mspec/bin/mspec ci :${{ matrix.rubyspec-target }}

  dependency-check:
    needs: maven-precache
    runs-on: ubuntu-latest

    name: Dependency check

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: remove default java except 21
        run: sudo apt remove temurin-8-jdk temurin-11-jdk temurin-17-jdk
      - name: set up java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      # Restore the cache but never save it. setup-java saves from the first job to finish,
      # and this job does not run a full build, so its cache would be missing plugins.
      - &restore-maven-cache
        name: restore maven cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml', '**/.mvn/wrapper/maven-wrapper.properties', '**/.mvn/extensions.xml') }}
          restore-keys: setup-java-Linux-x64-maven-
      - &restore-maven-wrapper-cache
        name: restore maven wrapper cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.m2/wrapper/dists
          key: setup-java-Linux-x64-maven-wrapper-${{ hashFiles('**/.mvn/wrapper/maven-wrapper.properties') }}
      - name: dependency convergence
        run: tool/maven-ci-script.sh
        env:
          PHASE: 'install -Pmain -Dinvoker.test=GH-6081*'

  test-versions:
    needs: maven-precache
    runs-on: ubuntu-latest

    name: Verify build artifacts
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: remove default java except 21
        run: sudo apt remove temurin-8-jdk temurin-11-jdk temurin-17-jdk
      - name: set up java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      # the same restore-only steps as dependency-check
      - *restore-maven-cache
      - *restore-maven-wrapper-cache
      - name: maven-ci-script.sh
        run: tool/maven-ci-script.sh
        env:
          COMMAND: 'test/check_versions.sh'

  sequel:
    needs: maven-precache
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sequel_test
        ports: [ "3306:3306" ]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sequel_test
        ports: ["3307:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          distribution: 'temurin'
      - name: sequel
        run: tool/sequel-github-actions.sh

  concurrent-ruby:
    needs: maven-precache
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          distribution: 'temurin'
      - name: concurrent-ruby
        run: tool/concurrent-ruby-github-actions.sh

  maven-test-openj9-21:
    needs: maven-precache
    runs-on: ubuntu-latest

    name: mvn -Ptest (OpenJ9 Java 21)

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          distribution: 'semeru'
          jruby-flags: ''
      - name: test profile
        run: "tool/maven-ci-script.sh"
        env:
          PHASE: 'package -Ptest'

  jruby-shell-check:
    runs-on: ubuntu-latest

    name: shellcheck jruby.sh

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install shellcheck
        run: tool/ci-retry.sh sudo apt install shellcheck
      - name: run shellcheck
        run: shellcheck bin/jruby.sh

  tests-passed:
    runs-on: ubuntu-latest
    needs: [mvn-test, mvn-test-extended, mvn-test-windows, dependency-check, rake-test, rake-test-indy-off, test-versions, sequel, concurrent-ruby, jruby-tests-dev, regression-specs-jit]
    steps:
      - run: echo Everything passed!

  publish-snapshot:
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/master' && github.repository == 'jruby/jruby' }}
    needs: tests-passed
    uses: ./.github/workflows/snapshot-publish.yml
    with:
      javaLevel: 21
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
